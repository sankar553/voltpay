<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4fd7" />
    <title>Offline · VoltPay</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfd;
        --fg: #161a2b;
        --muted: #5a6078;
        --card: #fff;
        --border: #e3e5ee;
        --primary: #1d4fd7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161f;
          --fg: #f2f3f8;
          --muted: #a3a8bd;
          --card: #1b1e2b;
          --border: #2c3042;
          --primary: #6c97ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .amount {
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .small {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 4px 0 0;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        VoltPay needs a connection to load bills and take payments. Here’s the last bill you viewed
        on this device.
      </p>
      <div class="card" id="bill" hidden>
        <p class="small" id="meter"></p>
        <div class="amount" id="amount"></div>
        <p class="small" id="due"></p>
        <p class="small" id="saved"></p>
      </div>
      <p id="none" hidden>No saved bill yet. Open your dashboard once while online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      try {
        var raw = localStorage.getItem("voltpay:last-bill");
        var b = raw && JSON.parse(raw);
        if (b && typeof b.amountPaise === "number") {
          var inr = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR" });
          var fmt = function (iso) {
            return new Date(iso).toLocaleDateString("en-IN", {
              day: "numeric",
              month: "short",
              year: "numeric",
            });
          };
          document.getElementById("meter").textContent =
            "Meter " + b.meterNumber + " · " + b.billNumber;
          document.getElementById("amount").textContent = inr.format(b.amountPaise / 100);
          document.getElementById("due").textContent = "Due " + fmt(b.dueDate + "T00:00:00");
          document.getElementById("saved").textContent =
            "As of " + fmt(b.savedAt) + " — may be out of date.";
          document.getElementById("bill").hidden = false;
        } else {
          document.getElementById("none").hidden = false;
        }
      } catch (e) {
        document.getElementById("none").hidden = false;
      }
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
