<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – PowerScan</title>
  <meta name="description" content="Log in or register for PowerScan to manage your electricity bill payments.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#f0f7ff,#ecfdf5); padding:24px; }
    .auth-card { background:#fff; border-radius:var(--radius-xl); padding:48px; max-width:440px; width:100%; box-shadow:var(--shadow-xl); }
    .auth-tabs { display:flex; gap:0; margin-bottom:32px; border-radius:var(--radius); overflow:hidden; border:2px solid var(--gray-200); }
    .auth-tab { flex:1; padding:12px; text-align:center; font-weight:600; cursor:pointer; background:var(--gray-50); color:var(--gray-500); transition:var(--transition); border:none; font-family:inherit; font-size:.95rem; }
    .auth-tab.active { background:linear-gradient(135deg,var(--blue-600),var(--blue-700)); color:#fff; }
    .auth-form { display:none; flex-direction:column; gap:18px; }
    .auth-form.active { display:flex; }
    .auth-divider { text-align:center; color:var(--gray-400); font-size:.85rem; margin:8px 0; position:relative; }
    .auth-divider::before,.auth-divider::after { content:''; position:absolute; top:50%; width:40%; height:1px; background:var(--gray-200); }
    .auth-divider::before { left:0; }
    .auth-divider::after { right:0; }
    .alert { padding:12px 16px; border-radius:var(--radius); font-size:.9rem; margin-bottom:8px; display:none; }
    .alert-success { background:var(--green-50); color:var(--green-700); border:1px solid var(--green-100); }
    .alert-error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .alert.show { display:block; animation:fadeIn .3s; }
    @media(max-width:480px) { .auth-card { padding:32px 20px; } }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" style="text-decoration:none;color:var(--gray-500);font-size:.9rem;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    <div style="text-align:center;margin-bottom:24px;">
      <a href="index.html" class="nav-logo" style="justify-content:center;margin-bottom:12px;">
        <div class="logo-icon"><i class="fas fa-bolt"></i></div>
        <span>PowerScan</span>
      </a>
      <p style="color:var(--gray-500);font-size:.95rem;">Manage your electricity payments</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="rajesh@example.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-submit" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
      <p style="text-align:center;font-size:.85rem;color:var(--gray-500);">Demo: rajesh@example.com / demo123</p>
    </form>

    <!-- REGISTER FORM -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="regPhone">Phone Number</label>
        <input type="tel" id="regPhone" placeholder="+91 XXXXX XXXXX">
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn-submit" id="regBtn"><i class="fas fa-user-plus"></i> Create Account</button>
    </form>
  </div>
</div>

<script>
const API = window.location.origin + '/api';

// If already logged in, skip login page and go straight to dashboard
(function() {
  const token = localStorage.getItem('token');
  const user  = localStorage.getItem('user');
  if (token && user) {
    // Replace auth in history so back button won't come back here
    window.location.replace('dashboard.html');
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => {
    t.classList.toggle('active', (tab==='login' && i===0) || (tab==='register' && i===1));
  });
  document.getElementById('loginForm').classList.toggle('active', tab==='login');
  document.getElementById('registerForm').classList.toggle('active', tab==='register');
  hideAlert();
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.className = 'alert alert-' + type + ' show';
  el.textContent = msg;
}
function hideAlert() { document.getElementById('alertBox').className = 'alert'; }

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
  btn.disabled = true;

  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showAlert('Login successful! Redirecting...', 'success');
      // Use replace so auth.html is removed from history — back button won't return here
      setTimeout(() => window.location.replace('dashboard.html'), 1000);
    } else {
      showAlert(data.error || 'Login failed', 'error');
    }
  } catch (err) { showAlert('Server not reachable', 'error'); }
  btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login'; btn.disabled = false;
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
  btn.disabled = true;

  try {
    const res = await fetch(API + '/auth/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        password: document.getElementById('regPassword').value
      })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showAlert('Account created! Redirecting...', 'success');
      setTimeout(() => window.location.replace('dashboard.html'), 1000);
    } else {
      showAlert(data.error || 'Registration failed', 'error');
    }
  } catch (err) { showAlert('Server not reachable', 'error'); }
  btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account'; btn.disabled = false;
}
</script>
</body>
</html>
